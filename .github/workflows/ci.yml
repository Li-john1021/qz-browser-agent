name: Developer checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: qz-browser-agent

jobs:
  portable-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: qz-browser-agent
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: qz-browser-agent/.nvmrc
          cache: npm
          cache-dependency-path: qz-browser-agent/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - if: runner.os == 'Linux'
        run: npm exec playwright install-deps chromium
      - name: Tool and Renderer browser contracts
        run: npm test -- playwright renderer-lifecycle.spec.mjs typescript-tool.spec.mjs extension-example.spec.mjs --workers 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-failure-${{ matrix.os }}
          path: qz-browser-agent/tests/results/playwright/
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: qz-browser-agent
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: qz-browser-agent/.nvmrc
          cache: npm
          cache-dependency-path: qz-browser-agent/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.3
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm exec playwright install-deps chromium
      - run: npm run doctor
      - run: npm run verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: verify-failure
          path: qz-browser-agent/tests/results/playwright/
          retention-days: 7
