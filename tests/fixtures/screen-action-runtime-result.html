<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Act on screen navigation result</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef5f1;
      color: #163d2e;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      padding: 36px 48px;
      border: 1px solid #b8d4c7;
      border-radius: 16px;
      background: #fff;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Navigation completed</h1>
    <p>Loaded a new document and frame state.</p>
  </main>
  <script>
    const navigationCount = Number(new URL(location.href).searchParams.get("count") || 0);
    window.__readScreenActionState = () => ({
      navigationCount,
      scrollX: window.scrollX,
      scrollY: window.scrollY,
      url: location.href,
    });
  </script>
</body>
</html>
