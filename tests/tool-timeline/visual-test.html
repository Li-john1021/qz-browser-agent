<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Timeline Visual Tests</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/extension/sidepanel/sidepanel.css">
  <style>
    html,
    body {
      height: auto;
      min-height: 100%;
      overflow: auto;
    }

    body {
      background: var(--bg-elevated);
    }

    .visual-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 230px;
      gap: 12px;
      padding: 12px;
    }

    .visual-panel {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-secondary);
      box-shadow: var(--shadow-sm);
    }

    .visual-nav,
    .visual-inspector {
      position: sticky;
      top: 12px;
      align-self: start;
      padding: 10px;
    }

    .visual-title {
      margin-bottom: 8px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 560;
    }

    .visual-subtitle {
      margin-bottom: 10px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .visual-button-grid {
      display: grid;
      gap: 6px;
    }

    .visual-btn {
      width: 100%;
      min-height: 26px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      font: 11px/1.35 var(--font-sans);
      text-align: left;
      cursor: pointer;
      transition: var(--transition-surface);
    }

    .visual-btn:hover,
    .visual-btn.active {
      border-color: var(--border-focus);
      background: var(--accent-subtle);
      color: var(--text-primary);
    }

    .visual-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    .visual-toolbar .visual-btn {
      width: auto;
      white-space: nowrap;
    }

    .visual-device-wrap {
      display: flex;
      justify-content: center;
      padding: 14px;
      overflow-x: auto;
    }

    .visual-device {
      width: var(--visual-width, 420px);
      min-height: 760px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-primary);
      overflow: hidden;
    }

    .visual-device-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .visual-device-head b {
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 560;
    }

    .visual-device-head span {
      color: var(--text-muted);
      font: 10px/1.4 var(--font-mono);
    }

    #messages.visual-messages {
      height: auto;
      min-height: 700px;
      overflow: visible;
      padding: 14px 12px 28px;
    }

    .visual-messages:not(.visual-collapsible-motion-test) .msg {
      animation: none;
    }

    .visual-section-label {
      margin: 12px 0 6px;
      color: var(--text-muted);
      font: 10px/1.4 var(--font-mono);
    }

    .visual-assertions {
      display: grid;
      gap: 6px;
    }

    .visual-assertion {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 6px;
      align-items: start;
      color: var(--text-secondary);
      font-size: 11px;
      line-height: 1.4;
    }

    .visual-assertion-dot {
      width: 6px;
      height: 6px;
      margin-top: 5px;
      border-radius: 50%;
      background: var(--red);
    }

    .visual-assertion.pass .visual-assertion-dot {
      background: var(--green);
    }

    .visual-assertion b {
      color: var(--text-primary);
      font-weight: 520;
    }

    .visual-json {
      max-height: 260px;
      margin-top: 10px;
      padding: 8px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--code-bg);
      color: var(--text-secondary);
      font: 10px/1.5 var(--font-mono);
      white-space: pre-wrap;
    }

    .visual-flow-editor {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .visual-flow-label {
      display: grid;
      gap: 4px;
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 520;
    }

    .visual-flow-label span {
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.35;
    }

    .visual-flow-textarea {
      width: 100%;
      min-height: 118px;
      resize: vertical;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--code-bg);
      color: var(--text-secondary);
      font: 10px/1.5 var(--font-mono);
      outline: none;
    }

    .visual-flow-textarea:focus {
      border-color: var(--border-focus);
    }

    .visual-flow-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .visual-flow-actions .visual-btn {
      text-align: center;
    }

    .visual-flow-status {
      min-height: 17px;
      color: var(--text-muted);
      font: 10px/1.45 var(--font-mono);
      overflow-wrap: anywhere;
    }

    .visual-tool-components {
      display: grid;
      gap: 10px;
    }

    .visual-tool-component {
      min-width: 0;
      padding: 8px;
      border: 1px solid color-mix(in srgb, var(--border) 84%, transparent);
      border-radius: var(--radius-lg);
      background: color-mix(in srgb, var(--bg-secondary) 86%, var(--bg-elevated));
    }

    .visual-tool-component-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 10.5px;
      line-height: 1.3;
    }

    .visual-tool-component-label span {
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .visual-tool-component-label b {
      color: var(--text-secondary);
      font-weight: 500;
    }

    @media (max-width: 900px) {
      .visual-shell {
        grid-template-columns: 1fr;
      }

      .visual-nav,
      .visual-inspector {
        position: static;
      }
    }
  </style>
</head>
<body>
  <div class="visual-shell">
    <aside class="visual-panel visual-nav">
      <div class="visual-title">工具时间线 testsuite</div>
      <div class="visual-subtitle">直接调用生产 renderer，覆盖连续工具、关键证据、等待用户和错误状态。</div>
      <div id="scenario-buttons" class="visual-button-grid"></div>
      <div class="visual-flow-editor">
        <label class="visual-flow-label">
          对话流 JSON
          <span>支持 transcript entry 数组，或 { title, entries }。</span>
          <textarea id="conversation-flow-input" class="visual-flow-textarea" spellcheck="false"></textarea>
        </label>
        <label class="visual-flow-label">
          操作流 JSON
          <span>动作：expandAll / collapseAll / clickStep / toggleGroup / patch / allTools / expandTool / clickCopy / wait。</span>
          <textarea id="operation-flow-input" class="visual-flow-textarea" spellcheck="false"></textarea>
        </label>
        <div class="visual-flow-actions">
          <button id="render-flow" class="visual-btn" type="button">渲染对话</button>
          <button id="run-flow" class="visual-btn" type="button">运行操作</button>
        </div>
        <div id="flow-status" class="visual-flow-status"></div>
      </div>
    </aside>

    <section class="visual-panel">
      <div class="visual-toolbar">
        <button class="visual-btn active" data-width="420">窄宽 420</button>
        <button class="visual-btn" data-width="360">极窄 360</button>
        <button class="visual-btn" data-width="560">宽 560</button>
        <button id="expand-all" class="visual-btn">展开全部</button>
        <button id="collapse-all" class="visual-btn">折叠全部</button>
        <button id="patch-running" class="visual-btn">模拟 patch</button>
      </div>
      <div class="visual-device-wrap">
        <div id="visual-device" class="visual-device">
          <div class="visual-device-head">
            <b id="device-title">对话流</b>
            <span id="device-meta">420px</span>
          </div>
          <main id="messages" class="visual-messages"></main>
        </div>
      </div>
    </section>

    <aside class="visual-panel visual-inspector">
      <div class="visual-title">检查结果</div>
      <div id="assertions" class="visual-assertions"></div>
      <pre id="debug-json" class="visual-json"></pre>
    </aside>
  </div>

  <script type="module" src="./visual-test.js"></script>
</body>
</html>
