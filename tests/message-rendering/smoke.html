<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Rendering Smoke Test</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/extension/sidepanel/sidepanel.css">
  <script src="/tests/message-rendering/cases.js"></script>
  <style>
    .smoke-header {
      display: block;
    }

    .smoke-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .smoke-title h1 {
      font-size: 13px;
      font-weight: 650;
      color: var(--text-secondary);
    }

    .smoke-status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.3;
    }

    .smoke-status.pass {
      color: var(--green);
      border-color: var(--success-border);
    }

    .smoke-status.fail {
      color: var(--red);
      border-color: color-mix(in srgb, var(--red) 48%, var(--border));
    }

    #messages.smoke-messages {
      width: min(100%, 980px);
      margin: 0 auto;
      padding-bottom: 34px;
    }

    .smoke-case {
      margin: 0 0 14px;
      padding: 0;
    }

    .smoke-case-title {
      margin: 0 0 5px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
    }

    .smoke-metrics {
      margin-top: 6px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="header" class="smoke-header">
      <div class="smoke-title">
        <h1>Message Rendering Smoke Test</h1>
        <div id="status" class="smoke-status">running...</div>
      </div>
    </header>
    <main id="messages" class="smoke-messages"></main>
  </div>

  <script>
    const messagesEl = document.querySelector("#messages");
    const statusEl = document.querySelector("#status");
    const CODE_BLOCK_TAIL_RESUME_PX = 28;

    const smoke = {
      assertions: 0,
      failures: [],
      cases: [],
      viewport: {
        width: window.innerWidth,
        height: window.innerHeight,
      },
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      })[ch]);
    }

    function highlightJsonValue(value) {
      return escapeHtml(JSON.stringify(value, null, 2));
    }

    function highlightJavaScriptCode(value) {
      return escapeHtml(value);
    }

    function assertSmoke(condition, name, details = {}) {
      smoke.assertions += 1;
      if (condition) return;
      smoke.failures.push({ name, details });
    }

    function nextFrame() {
      return new Promise(resolve => requestAnimationFrame(() => resolve()));
    }

    async function installProductionHighlighter() {
      const { highlightCode, normalizeCodeLanguage, codeLineCount } = await import("/extension/sidepanel/ui/code-highlighter.js");
      window.__messageSmokeHighlighter = { highlightCode, normalizeCodeLanguage, codeLineCount };
      Object.assign(window, window.__messageSmokeHighlighter);
    }

    async function installProductionRenderer() {
      await installProductionHighlighter();
      window.__openedLinks = [];
      window.chrome = {
        tabs: {
          create({ url }) {
            window.__openedLinks.push(url);
            return Promise.resolve();
          },
        },
      };
      const module = await import("/extension/sidepanel/features/chat/markdown-feature.js");
      module.createMarkdownFeature();
      window.__messageSmokeRenderer = { renderMarkdown: module.renderMarkdown };
      return window.__messageSmokeRenderer;
    }

    function renderMessageCase(renderer, name, markdown, renderOptions = { math: false }) {
      const article = document.createElement("article");
      article.className = "smoke-case";
      article.innerHTML = `
        <h2 class="smoke-case-title"></h2>
        <div class="msg msg-assistant">
          <div class="msg-content"></div>
        </div>
        <div class="smoke-metrics"></div>
      `;
      article.querySelector(".smoke-case-title").textContent = name;
      const content = article.querySelector(".msg-content");
      content.innerHTML = renderer.renderMarkdown(markdown, renderOptions);
      messagesEl.append(article);
      return {
        article,
        content,
        metrics: article.querySelector(".smoke-metrics"),
      };
    }

    function markdownCodeBlocks(root) {
      return Array.from(root.querySelectorAll(".markdown-code-block"));
    }

    function codeBlockPres(root) {
      return Array.from(root.querySelectorAll(".markdown-code-block > pre"));
    }

    function hasHighlightSpans(codeEl) {
      return Boolean(codeEl?.querySelector?.('[class^="hljs-"], [class*=" hljs-"]'));
    }

    function numberStyle(style, prop) {
      return Number.parseFloat(style.getPropertyValue(prop)) || 0;
    }

    function runCodeCase(renderer, testCase) {
      const { content, metrics } = renderMessageCase(renderer, testCase.name, testCase.markdown, testCase.renderOptions || { math: false });
      const blocks = markdownCodeBlocks(content);
      const expected = testCase.expected || {};
      assertSmoke(blocks.length === expected.blocks, `${testCase.name}: block count`, {
        actual: blocks.length,
        expected: expected.blocks,
      });
      const block = blocks[0];
      if (!block) return;
      const pre = block.querySelector("pre");
      const code = block.querySelector("pre > code");
      const button = block.querySelector(".code-copy-btn");
      const blockRect = block.getBoundingClientRect();
      const buttonRect = button?.getBoundingClientRect?.();
      const preStyle = getComputedStyle(pre);
      const wrapStyle = getComputedStyle(block);
      const hasSpans = hasHighlightSpans(code);
      const metricsPayload = {
        language: block.dataset.language || "",
        vendor: block.dataset.highlighter || "",
        hasSpans,
        preHeight: Math.round(pre.getBoundingClientRect().height),
        preScrollHeight: pre.scrollHeight,
        preScrollWidth: pre.scrollWidth,
        preClientWidth: pre.clientWidth,
        codeScrollWidth: code?.scrollWidth || 0,
        codeClientWidth: code?.clientWidth || 0,
      };
      smoke.cases.push({ name: testCase.name, metrics: metricsPayload });
      metrics.textContent = JSON.stringify(metricsPayload, null, 2);

      if (expected.language) {
        assertSmoke(block.dataset.language === expected.language, `${testCase.name}: language`, {
          actual: block.dataset.language || "",
          expected: expected.language,
        });
      }
      if (expected.vendor) {
        assertSmoke(block.dataset.highlighter === expected.vendor, `${testCase.name}: highlighter vendor`, {
          actual: block.dataset.highlighter || "",
          expected: expected.vendor,
        });
      }
      if ("highlighted" in expected) {
        assertSmoke(hasSpans === expected.highlighted, `${testCase.name}: highlighted markup`, {
          actual: hasSpans,
          expected: expected.highlighted,
          html: code?.innerHTML?.slice?.(0, 180) || "",
        });
      }
      if (expected.copyText) {
        assertSmoke(block.dataset.copyText === expected.copyText, `${testCase.name}: copy text`, {
          actual: block.dataset.copyText,
          expected: expected.copyText,
        });
      }
      assertSmoke(Boolean(button), `${testCase.name}: copy button exists`);
      if (buttonRect) {
        assertSmoke(
          buttonRect.left >= blockRect.left &&
          buttonRect.right <= blockRect.right + 1 &&
          buttonRect.top >= blockRect.top - 1 &&
          buttonRect.bottom <= blockRect.bottom + 1,
          `${testCase.name}: copy button stays inside block`,
          { button: rectPayload(buttonRect), block: rectPayload(blockRect) },
        );
      }
      assertSmoke(
        Math.abs(numberStyle(preStyle, "padding-top") - numberStyle(preStyle, "padding-bottom")) <= 0.5,
        `${testCase.name}: vertical padding is balanced`,
        { paddingTop: preStyle.paddingTop, paddingBottom: preStyle.paddingBottom },
      );
      assertSmoke(
        Math.abs(numberStyle(wrapStyle, "margin-top") - numberStyle(wrapStyle, "margin-bottom")) <= 0.5,
        `${testCase.name}: wrapper margins are balanced`,
        { marginTop: wrapStyle.marginTop, marginBottom: wrapStyle.marginBottom },
      );
      assertSmoke(
        preStyle.overscrollBehaviorX === "contain",
        `${testCase.name}: horizontal overscroll is contained`,
        { actual: preStyle.overscrollBehaviorX },
      );
      assertSmoke(
        preStyle.scrollbarGutter.includes("stable"),
        `${testCase.name}: scrollbar gutter is stable`,
        { actual: preStyle.scrollbarGutter },
      );
      if (expected.verticalScroll) {
        assertSmoke(pre.scrollHeight > pre.clientHeight + 12, `${testCase.name}: vertical internal scroll`, {
          scrollHeight: pre.scrollHeight,
          clientHeight: pre.clientHeight,
        });
        assertSmoke(pre.getBoundingClientRect().height <= expectedMaxCodeBlockHeight(pre) + 1, `${testCase.name}: max height cap`, {
          height: pre.getBoundingClientRect().height,
          expectedMax: expectedMaxCodeBlockHeight(pre),
        });
      }
      if (expected.horizontalScroll) {
        const horizontalOverflow = Math.max(
          pre.scrollWidth - pre.clientWidth,
          (code?.scrollWidth || 0) - (code?.clientWidth || 0),
        );
        assertSmoke(horizontalOverflow > 20, `${testCase.name}: horizontal internal scroll`, {
          scrollWidth: pre.scrollWidth,
          clientWidth: pre.clientWidth,
          codeScrollWidth: code?.scrollWidth || 0,
          codeClientWidth: code?.clientWidth || 0,
          horizontalOverflow,
        });
        assertNoPageHorizontalOverflow(`${testCase.name}: no page horizontal overflow`);
      }
    }

    function runMarkdownCase(renderer, testCase) {
      const { content, metrics } = renderMessageCase(
        renderer,
        testCase.name,
        testCase.markdown,
        testCase.renderOptions || { math: false },
      );
      const expected = testCase.expected || {};
      const metricsPayload = {
        text: content.textContent,
        html: content.innerHTML,
      };
      smoke.cases.push({ name: testCase.name, metrics: metricsPayload });
      metrics.textContent = JSON.stringify(metricsPayload, null, 2);

      for (const [selector, count] of Object.entries(expected.selectors || {})) {
        const actual = content.querySelectorAll(selector).length;
        assertSmoke(actual === count, `${testCase.name}: ${selector} count`, { actual, expected: count });
      }
      for (const text of expected.absentText || []) {
        assertSmoke(!content.textContent.includes(text), `${testCase.name}: absent text ${text}`, {
          text: content.textContent,
        });
      }
      for (const text of expected.textIncludes || []) {
        assertSmoke(content.textContent.includes(text), `${testCase.name}: includes text ${text}`, {
          text: content.textContent,
        });
      }
      for (const check of expected.attributes || []) {
        const node = content.querySelector(check.selector);
        const actual = node?.getAttribute(check.name) || "";
        assertSmoke(Boolean(node), `${testCase.name}: attribute node exists ${check.selector}`);
        assertSmoke(actual === check.value, `${testCase.name}: ${check.selector} ${check.name}`, {
          actual,
          expected: check.value,
        });
      }
      for (const check of expected.absentAttributes || []) {
        const node = content.querySelector(check.selector);
        assertSmoke(Boolean(node), `${testCase.name}: absent attribute node exists ${check.selector}`);
        assertSmoke(!node?.hasAttribute(check.name), `${testCase.name}: ${check.selector} does not have ${check.name}`, {
          actual: node?.getAttribute(check.name) || "",
        });
      }
      for (const check of expected.linkHrefs || []) {
        const link = content.querySelector(check.selector);
        const href = link?.getAttribute("href") || "";
        assertSmoke(Boolean(link), `${testCase.name}: link exists ${check.selector}`);
        if (check.value) {
          assertSmoke(href === check.value, `${testCase.name}: href matches ${check.selector}`, {
            actual: href,
            expected: check.value,
          });
        }
        if (check.includes) {
          assertSmoke(href.includes(check.includes), `${testCase.name}: href includes ${check.includes}`, {
            href,
          });
        }
      }
      for (const selector of expected.internalFragmentClicks || []) {
        const link = content.querySelector(selector);
        const beforeOpenedCount = window.__openedLinks.length;
        const href = link?.getAttribute("href") || "";
        const target = internalFragmentTargetElement(href);
        history.replaceState(null, "", location.pathname + location.search);
        link?.click();
        assertSmoke(Boolean(link), `${testCase.name}: internal link exists ${selector}`);
        assertSmoke(Boolean(target), `${testCase.name}: internal link target exists ${selector}`, { href });
        assertSmoke(!target || content.contains(target), `${testCase.name}: internal link target stays within message ${selector}`, {
          href,
          targetId: target?.id || "",
        });
        assertSmoke(location.hash === "", `${testCase.name}: internal link does not mutate page hash ${selector}`, {
          hash: location.hash,
        });
        assertSmoke(window.__openedLinks.length === beforeOpenedCount, `${testCase.name}: internal link does not open tab ${selector}`, {
          openedLinks: window.__openedLinks.slice(beforeOpenedCount),
        });
      }
      for (const check of expected.externalLinkClicks || []) {
        const link = content.querySelector(check.selector);
        const beforeOpenedCount = window.__openedLinks.length;
        history.replaceState(null, "", location.pathname + location.search);
        link?.click();
        const opened = window.__openedLinks.slice(beforeOpenedCount);
        assertSmoke(Boolean(link), `${testCase.name}: external link exists ${check.selector}`);
        assertSmoke(opened.length === 1, `${testCase.name}: external link opens one tab ${check.selector}`, {
          opened,
        });
        if (check.value) {
          assertSmoke(opened[0] === check.value, `${testCase.name}: external opened url matches ${check.selector}`, {
            actual: opened[0],
            expected: check.value,
          });
        }
        if (check.includes) {
          assertSmoke(String(opened[0] || "").includes(check.includes), `${testCase.name}: external opened url includes ${check.includes}`, {
            opened,
          });
        }
      }
    }

    function internalFragmentTargetElement(href) {
      const raw = String(href || "").trim();
      if (!raw.startsWith("#") || raw.length <= 1) return null;
      let id = raw.slice(1);
      try {
        id = decodeURIComponent(id);
      } catch (_e) {}
      return document.getElementById(id);
    }

    function rectPayload(rect) {
      return {
        left: Math.round(rect.left),
        top: Math.round(rect.top),
        right: Math.round(rect.right),
        bottom: Math.round(rect.bottom),
        width: Math.round(rect.width),
        height: Math.round(rect.height),
      };
    }

    function expectedMaxCodeBlockHeight(pre) {
      const value = Number.parseFloat(getComputedStyle(pre).maxHeight);
      return Number.isFinite(value) ? value : Math.min(window.innerHeight * 0.56, 520);
    }

    function assertNoPageHorizontalOverflow(name) {
      const messagesOverflow = messagesEl.scrollWidth - messagesEl.clientWidth;
      const bodyOverflow = document.documentElement.scrollWidth - document.documentElement.clientWidth;
      assertSmoke(messagesOverflow <= 1 && bodyOverflow <= 1, name, {
        messagesScrollWidth: messagesEl.scrollWidth,
        messagesClientWidth: messagesEl.clientWidth,
        documentScrollWidth: document.documentElement.scrollWidth,
        documentClientWidth: document.documentElement.clientWidth,
      });
    }

    function isNearCodeBlockTail(pre, threshold = CODE_BLOCK_TAIL_RESUME_PX) {
      if (!pre) return true;
      return pre.scrollHeight - pre.scrollTop - pre.clientHeight <= threshold;
    }

    function captureCodeBlockScrollState(root) {
      return codeBlockPres(root).map((pre, index) => ({
        index,
        top: pre.scrollTop || 0,
        left: pre.scrollLeft || 0,
        followTail: codeBlockShouldFollowTail(pre),
      }));
    }

    function codeBlockShouldFollowTail(pre) {
      if (!pre) return true;
      if (pre.dataset.followTail === "false") return false;
      if (pre.dataset.followTail === "true") return true;
      return isNearCodeBlockTail(pre);
    }

    function restoreCodeBlockScrollState(root, state, { followNewBlocks = false } = {}) {
      const targets = codeBlockPres(root);
      targets.forEach((pre, index) => {
        const item = state[index];
        const followTail = item ? item.followTail : Boolean(followNewBlocks);
        pre.dataset.followTail = followTail ? "true" : "false";
        if (item) pre.scrollLeft = item.left;
        if (followTail) {
          pre.scrollTop = pre.scrollHeight;
        } else if (item) {
          pre.scrollTop = Math.min(item.top, Math.max(0, pre.scrollHeight - pre.clientHeight));
        }
      });
    }

    function patchMarkdownContent(renderer, content, markdown, options = {}) {
      const state = captureCodeBlockScrollState(content);
      content.innerHTML = renderer.renderMarkdown(markdown, { math: false });
      restoreCodeBlockScrollState(content, state, options);
    }

    function isWheelHandledByCodeBlockLike(pre, deltaY) {
      const delta = Number(deltaY) || 0;
      if (Math.abs(delta) < 2) return false;
      if (pre.scrollHeight <= pre.clientHeight + 1) return false;
      const atTop = pre.scrollTop <= 1;
      const atBottom = isNearCodeBlockTail(pre, 1);
      return (delta < 0 && !atTop) || (delta > 0 && !atBottom);
    }

    async function runScrollAndGlitchCases(renderer) {
      const frames = window.QingzhouMessageRenderingCases.buildScrollFrames();
      const { content, metrics } = renderMessageCase(renderer, "streamed code block scroll and layout", frames[0]);
      await nextFrame();
      let pre = codeBlockPres(content)[0];
      assertSmoke(pre.scrollHeight > pre.clientHeight + 12, "stream: initial block is scrollable", {
        scrollHeight: pre.scrollHeight,
        clientHeight: pre.clientHeight,
      });

      pre.scrollTop = pre.scrollHeight;
      pre.dataset.followTail = "true";
      patchMarkdownContent(renderer, content, frames[1], { followNewBlocks: true });
      await nextFrame();
      pre = codeBlockPres(content)[0];
      assertSmoke(isNearCodeBlockTail(pre, 2), "stream: follows tail while user is at tail", {
        scrollTop: pre.scrollTop,
        scrollHeight: pre.scrollHeight,
        clientHeight: pre.clientHeight,
      });

      pre.scrollTop = 0;
      pre.dataset.followTail = "false";
      patchMarkdownContent(renderer, content, frames[2], { followNewBlocks: true });
      await nextFrame();
      pre = codeBlockPres(content)[0];
      assertSmoke(pre.scrollTop <= 2, "stream: user scroll-up cancels tail follow", {
        scrollTop: pre.scrollTop,
      });

      const heightFrames = [];
      for (const frame of frames) {
        patchMarkdownContent(renderer, content, frame, { followNewBlocks: true });
        await nextFrame();
        pre = codeBlockPres(content)[0];
        pre.scrollTop = pre.scrollHeight;
        heightFrames.push(Math.round(pre.getBoundingClientRect().height * 10) / 10);
      }
      const minHeight = Math.min(...heightFrames);
      const maxHeight = Math.max(...heightFrames);
      assertSmoke(maxHeight - minHeight <= 2, "glitch: capped block height stays stable across stream patches", {
        heightFrames,
      });
      assertSmoke(maxHeight <= expectedMaxCodeBlockHeight(pre) + 1, "glitch: capped block does not exceed CSS max height", {
        maxHeight,
        expectedMax: expectedMaxCodeBlockHeight(pre),
      });

      pre.scrollTop = 0;
      const topUp = isWheelHandledByCodeBlockLike(pre, -120);
      const topDown = isWheelHandledByCodeBlockLike(pre, 120);
      pre.scrollTop = Math.max(2, (pre.scrollHeight - pre.clientHeight) / 2);
      const middleUp = isWheelHandledByCodeBlockLike(pre, -120);
      const middleDown = isWheelHandledByCodeBlockLike(pre, 120);
      pre.scrollTop = pre.scrollHeight;
      const bottomDown = isWheelHandledByCodeBlockLike(pre, 120);
      assertSmoke(!topUp && topDown && middleUp && middleDown && !bottomDown, "scroll: wheel boundaries hand off to page", {
        topUp,
        topDown,
        middleUp,
        middleDown,
        bottomDown,
      });
      assertNoPageHorizontalOverflow("glitch: streamed code does not create horizontal page overflow");
      smoke.cases.push({
        name: "streamed code block scroll and layout",
        metrics: {
          heightFrames,
          wheel: { topUp, topDown, middleUp, middleDown, bottomDown },
        },
      });
      metrics.textContent = JSON.stringify({
        heightFrames,
        wheel: { topUp, topDown, middleUp, middleDown, bottomDown },
      }, null, 2);
    }

    async function run() {
      const renderer = await installProductionRenderer();
      for (const testCase of window.QingzhouMessageRenderingCases.buildMarkdownCases()) {
        runMarkdownCase(renderer, testCase);
      }
      for (const testCase of window.QingzhouMessageRenderingCases.buildCodeCases()) {
        runCodeCase(renderer, testCase);
      }
      await runScrollAndGlitchCases(renderer);
      const ok = smoke.failures.length === 0;
      window.__messageRenderingSmoke = smoke;
      statusEl.dataset.result = JSON.stringify(smoke);
      statusEl.className = `smoke-status ${ok ? "pass" : "fail"}`;
      statusEl.textContent = `${ok ? "PASS" : "FAIL"} assertions=${smoke.assertions} failures=${smoke.failures.length}`;
    }

    run().catch(error => {
      smoke.fatal = String(error?.stack || error);
      window.__messageRenderingSmoke = smoke;
      statusEl.dataset.result = JSON.stringify(smoke);
      statusEl.className = "smoke-status fail";
      statusEl.textContent = `FATAL ${String(error?.message || error)}`;
      console.error(error);
    });
  </script>
</body>
</html>
