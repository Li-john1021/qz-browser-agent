<div id="logs-panel" class="tab-panel hidden qz-scroll">
      <div class="logs-toolbar qz:flex qz:items-center qz:flex-wrap qz:gap-2">
        <button id="btn-refresh-logs" class="qz-btn qz-btn--secondary" data-i18n="diagnostics.refresh">刷新</button>
        <button id="btn-clear-logs" class="qz-btn qz-btn--secondary" data-i18n="diagnostics.clear">清空</button>
        <button id="btn-clear-landing-history" class="qz-btn qz-btn--secondary" type="button" data-i18n="diagnostics.clearLandingHistory">清除 Landing 历史</button>
        <span id="logs-action-status" class="logs-action-status qz:ml-auto" role="status" aria-live="polite"></span>
      </div>
      <pre id="logs-content" class="logs-content qz:flex-1 qz:m-0 qz:overflow-auto qz:whitespace-pre-wrap"></pre>
    </div>
