[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qz-browser-agent-mcp-bridge"
version = "0.2.5"
description = "MCP stdio server that bridges local MCP clients to the qz browser extension."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.28.1,<2",
  "uvicorn>=0.30.0",
]
authors = [
  { name = "qz" },
]
keywords = ["mcp", "qz-browser-agent", "browser-extension"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
qz-browser-agent-mcp-bridge = "qz_browser_agent_mcp_bridge.server:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/qz_browser_agent_mcp_bridge"]
